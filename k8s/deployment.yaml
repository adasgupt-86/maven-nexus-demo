apiVersion: apps/v1
kind: Deployment

metadata:
  name: maven-nexus-demo
  namespace: maven-demo

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: maven-nexus-demo

  template:
    metadata:
      labels:
        app: maven-nexus-demo

    spec:
      containers:
        - name: maven-nexus-demo

          image: 192.168.2.143:5000/maven-nexus-demo:latest

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
